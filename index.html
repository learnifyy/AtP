<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fellah Amine · 2050</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Grotesk:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--black:#000000;--red:#8b0000;--red2:#a00000;--white:#ffffff;--off:#e8e8e8;--dim:#555;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--off);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:1px;}::-webkit-scrollbar-thumb{background:var(--red);}

#star-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;background:#000;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:22px 48px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,0.98),transparent);}
.nav-logo{font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.4em;color:var(--white);text-transform:uppercase;}
.nav-tag{font-size:.58rem;letter-spacing:.3em;color:var(--dim);font-weight:300;}

#hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:1;}
.hero-content{position:relative;z-index:5;text-align:center;pointer-events:none;opacity:0;animation:fadeUp 1s ease 0.4s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.hero-main{font-family:'Inter',sans-serif;font-size:clamp(5rem,22vw,18rem);font-weight:900;color:#8b0000;line-height:1;letter-spacing:-.03em;text-shadow:0 0 80px rgba(139,0,0,0.5),0 0 160px rgba(139,0,0,0.25),0 0 300px rgba(100,0,0,0.15);}
.hero-name-sub{margin-top:22px;font-size:clamp(.9rem,2.5vw,1.4rem);font-weight:300;color:var(--off);letter-spacing:.35em;text-transform:uppercase;opacity:.5;}
.hero-role{margin-top:20px;font-size:.68rem;color:var(--dim);letter-spacing:.2em;font-weight:300;min-height:1.4em;}
.hero-role::after{content:'_';color:var(--red2);animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── SKILLS SECTION ── */
#skills-section{position:relative;z-index:2;background:transparent;padding:100px 20px 80px;}
.skills-wrap{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media(max-width: 700px){.skills-wrap{grid-template-columns:1fr;gap:30px;}}
.sk-box{background:rgba(0,0,0,0.75);border:1px solid rgba(139,0,0,0.18);border-radius:14px;padding:32px 26px;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s ease;}
.sk-box.visible{opacity:1;transform:translateY(0);}
.sk-box-title{font-family:'Inter',sans-serif;font-size:.5rem;letter-spacing:.46em;color:var(--dim);text-transform:uppercase;font-weight:300;margin-bottom:28px;text-align:center;}
.sk-row,.cert-row{margin-bottom:22px;}
.sk-top,.cert-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.sk-name,.cert-name{font-size:.68rem;color:var(--off);letter-spacing:.12em;font-weight:300;text-transform:uppercase;}
.cert-name{color:rgba(232,232,232,0.25);filter:blur(4px);user-select:none;pointer-events:none;}
.sk-pct,.cert-pct{font-family:'Inter',sans-serif;font-size:.62rem;color:var(--red2);font-weight:700;letter-spacing:.08em;}
.tube-wrap,.cert-tube-wrap{width:100%;height:6px;background:rgba(255,255,255,0.04);border-radius:99px;border:1px solid rgba(139,0,0,0.15);overflow:hidden;}
.tube-fill,.cert-tube-fill{height:100%;border-radius:99px;width:0%;background:linear-gradient(to right,#4a0000,#8b0000,#b00000);transition:width 1.4s cubic-bezier(.4,0,.2,1);}
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>
<nav>
  <div class="nav-logo">F · Amine</div>
  <div class="nav-tag">2050 · Algeria</div>
</nav>

<section id="hero">
  <div class="hero-content">
    <div class="hero-main">2050</div>
    <div class="hero-name-sub">Fellah Amine</div>
    <div class="hero-role" id="typeEl"></div>
  </div>
</section>

<section id="skills-section">
  <div class="skills-wrap">
    <div class="sk-box" id="sk-box-1">
      <div class="sk-box-title">Skills</div>
      <div class="sk-row"><div class="sk-top"><span class="sk-name">Programming</span><span class="sk-pct">35%</span></div><div class="tube-wrap"><div class="tube-fill" data-w="35"></div></div></div>
      <div class="sk-row"><div class="sk-top"><span class="sk-name">Photography</span><span class="sk-pct">88%</span></div><div class="tube-wrap"><div class="tube-fill" data-w="88"></div></div></div>
      <div class="sk-row"><div class="sk-top"><span class="sk-name">Sports</span><span class="sk-pct">92%</span></div><div class="tube-wrap"><div class="tube-fill" data-w="92"></div></div></div>
      <div class="sk-row"><div class="sk-top"><span class="sk-name">Chess</span><span class="sk-pct">67%</span></div><div class="tube-wrap"><div class="tube-fill" data-w="67"></div></div></div>
    </div>
    <div class="sk-box" id="sk-box-2">
      <div class="sk-box-title">Certificates</div>
      <div class="cert-row"><div class="cert-top"><span class="cert-name">English Certificate C1</span><span class="cert-pct">20%</span></div><div class="cert-tube-wrap"><div class="cert-tube-fill" data-w="20"></div></div></div>
      <div class="cert-row"><div class="cert-top"><span class="cert-name">Drone Pilot (CRTI)</span><span class="cert-pct">66%</span></div><div class="cert-tube-wrap"><div class="cert-tube-fill" data-w="66"></div></div></div>
      <div class="cert-row"><div class="cert-top"><span class="cert-name">AI Academy</span><span class="cert-pct">80%</span></div><div class="cert-tube-wrap"><div class="cert-tube-fill" data-w="80"></div></div></div>
    </div>
  </div>
</section>

<section id="section-three">...</section>

<script>
(function(){
/* ... كود الـ JS الخاص بالنجوم والأنيميشن ... */

/* ══ SKILLS & CERTS INTERSECTION ══ */
const skBoxes = document.querySelectorAll('.sk-box');
const skObs = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
      entry.target.querySelectorAll('.tube-fill, .cert-tube-fill').forEach(bar => {
        const w = bar.getAttribute('data-w');
        setTimeout(() => { bar.style.width = w + '%'; }, 200);
      });
      skObs.unobserve(entry.target);
    }
  });
}, { threshold: 0.2 });
skBoxes.forEach(box => skObs.observe(box));

/* باقي الـ JS */
})();
</script>
</body>
</html>
